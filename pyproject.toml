[project]
name = "claude-router"
version = "0.1.0"
description = "Local proxy that routes Claude Code requests to a self-hosted model when a decision model flags them"
readme = "README.md"
authors = [
    { name = "Josh Hu", email = "josh.hu@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.158.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
claude-router = "claude_router:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
